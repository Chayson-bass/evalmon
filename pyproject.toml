[project]
name = "simpeval"
version = "0.1.0"
description = "Simple LLM call logging, evals, and regression alerts for indie developers"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
simpeval = "simpeval.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["simpeval*"]
